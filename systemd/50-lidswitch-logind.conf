# Lidswitch: closing the lid must not suspend the machine.
#
# logind's default for HandleLidSwitch is "suspend", which is the one thing that
# would undo all of lidswitch's work: the laptop would sleep the moment the lid
# shut and no session would survive to keep working. "ignore" hands the decision
# to Hyprland, which Omarchy has already bound to lock the screen and take the
# internal display down instead.
#
# Drop this file in /etc/systemd/logind.conf.d/ and the change takes effect on
# the next logind restart (reboot, or `systemctl restart systemd-logind` from a
# TTY).
[Login]
HandleLidSwitch=ignore
